syntax = "proto2";
import "nanopb.proto";
import "sns_std_sensor.proto";

enum sns_snsdebug_msgid
{
  option (nanopb_enumopt).long_names = false;

  SNS_SNSDEBUG_MSGID_SNS_SNSDEBUG_DATA = 1024;
  SNS_SNSDEBUG_MSGID_FAILSAFE_CONFIG = 1080;
}


enum sns_snsdebug_sensor_id {
  option (nanopb_enumopt).long_names = false;

  SNS_SNSDEBUG_SENSOR_ID_ACCEL = 0x01;
  SNS_SNSDEBUG_SENSOR_ID_GYRO  = 0x02;
  SNS_SNSDEBUG_SENSOR_ID_MAG   = 0x04;
  SNS_SNSDEBUG_SENSOR_ID_PRESS = 0x08;
  SNS_SNSDEBUG_SENSOR_ID_PROX  = 0x10;
  SNS_SNSDEBUG_SENSOR_ID_LIGHT = 0x20;
}


// Configuration Message
// Used to either request for a certain configuration of the Sim Sensor or
// alter an already existing configuration of the Simulation Sensor
// Uses sns_std_sensor_config defined in sns_std_sensor.proto
// The message field definitions are as follows:
// 1) float sample_rate
//      containing the required sample rate of the Sim sensor in hertz

// Data Message
// Output data event generated by the snsdebug sensor.
message sns_snsdebug_data
{
  // snsdebug Vector along axis x,y,z in m/s2
  repeated float snsdebug = 1 [(nanopb).max_count = 3];

  // Accuracy of the data
  required sns_std_sensor_sample_status accuracy = 2;
}

// FailSafe
message sns_snsdebug_failsafe_config
{
  // 0:OFF, 1:ON
  required uint32 enable = 1;
  required uint32 sensor_id = 2;
}
