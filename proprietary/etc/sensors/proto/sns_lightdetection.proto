syntax = "proto2";
import "nanopb.proto";
import "sns_std_sensor.proto";

enum sns_lightdetection_msgid
{
  option (nanopb_enumopt).long_names = false;

  SNS_LIGHTDETECTION_MSGID_SNS_LIGHTDETECTION_REQ = 1022;
  SNS_LIGHTDETECTION_MSGID_SNS_LIGHTDETECTION_RES = 1023;
}

// register read/write result
enum sns_lightdetection_result {
  option (nanopb_enumopt).long_names = false;
  //--------------------------------------------
  SNS_LIGHTDETECTION_RESULT_SUCCESS  = 0;
  SNS_LIGHTDETECTION_RESULT_FAILURE  = 9;
  //--------------------------------------------
}

message sns_lightdetection_req_data
{
  required uint32 sample_rate  = 1;
  required uint32 threshold1   = 2;
  required uint32 threshold2   = 3;
}

message sns_lightdetection_res_data
{
  required uint32 result  = 1;
}

